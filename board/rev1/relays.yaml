  - {name: V1.2,  number: 2,  block: ext,  address: SR1.2.B, groups: [V]}
  - {name: V1.3,  number: 3,  block: ext,  address: SR1.2.C, groups: [V]}
  - {name: V1.4,  number: 4,  block: ext,  address: SR1.2.D, groups: [V]}
  - {name: V1.5,  number: 5,  block: ext,  address: SR1.2.E, groups: [V]}
  - {name: V1.6,  number: 6,  block: ext,  address: SR1.2.F, groups: [V]}
  - {name: V1.7,  number: 7,  block: ext,  address: SR1.2.G, groups: [V]}
  - {name: V1.8,  number: 8,  block: ext,  address: SR1.2.H, groups: [V]}
  - {name: V2.1,  number: 9,  block: ext,  address: SR1.3.A, groups: [V]}
  - {name: V2.2,  number: 10, block: ext,  address: SR1.3.B, groups: [V]}
  - {name: V2.3,  number: 11, block: ext,  address: SR1.3.C, groups: [V]}
  - {name: V2.4,  number: 12, block: ext,  address: SR1.3.D, groups: [V]}
  - {name: V2.5,  number: 13, block: ext,  address: SR1.3.E, groups: [V]}
  - {name: V2.6,  number: 14, block: ext,  address: SR1.3.F, groups: [V]}
  - {name: V2.7,  number: 15, block: ext,  address: SR1.3.G, groups: [V]}
  - {name: V3.1,  number: 16, block: mux,  address: PC0,     groups: [V]}
  - {name: V3.2,  number: 17, block: mux,  address: PC3,     groups: [V]}
  - {name: V3.3,  number: 18, block: mux,  address: PD3,     groups: [V]}
  - {name: V3.4,  number: 19, block: mux,  address: PG3,     groups: [V]}
  - {name: V3.5,  number: 20, block: mux,  address: PD7,     groups: [V]}
  - {name: V3.6,  number: 21, block: mux,  address: SR0.2.A, groups: [V], note: контрольная точка TP33}
  - {name: V3.7,  number: 22, block: mux,  address: PF2,     groups: [V]}
