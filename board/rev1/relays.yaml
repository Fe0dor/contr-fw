# Единый источник таблицы реле платы CONTR ревизии 1 (ТЗ 19, раздел 3.12, FW-239…FW-244).
#
# Из этого файла tools/gen_board.py порождает gen/relay_table.{h,c} (прошивка),
# gen/interlock-table.json (файл данных плагина по схеме SDK), gen/relay-numbers.json
# (эмулятор и интерфейс) и gen/interlock-groups.md (таблица документации).
# Ручная правка сгенерированных файлов запрещена; CI сверяет их с этим файлом (FW-240).
#
# Источник адресов и блоков — описание платы checker/docs/hardware/contr.md
# (таблица сигналов и раздел «Уточнения»). Порядок реле в этом файле — канонический
# порядок протокола (FW-120): V*, M*, A*, CH*, D*, PM*, RAtoDUT, RBtoDUT, L*.
#
# Номера реле (FW-244): назначаются один раз и не переиспользуются. Новое реле получает
# номер next_number, после чего next_number увеличивается. Удалённое реле переносит свой
# номер в retired; генератор отвергает повтор номера, номер из retired и номер >= next_number.
#
# Адрес: вывод STM32 (`PG8`) или выход сдвигового регистра `SRg.r.o` — цепочка g,
# регистр r от нуля (регистр 0 ближайший к MCU), выход o = A…H.
#
# Блоки — разделы таблицы сигналов описания платы:
#   ext  — реле для переключения внешних сигналов на измерительные приборы
#   test — испытание (второе изделие стенда)
#   int  — реле для переключения внутренних сигналов на измерительные приборы
#   mux  — сигналы на силовик (плата MUX)
#   load — сигналы на блок нагрузок

table_version: "rev1.1"
next_number: 82
retired: []

# Шинные группы блокировок (раздел 3.3 ТЗ): в группе одновременно включено не более
# одного реле. Порядок групп здесь — порядок в файле данных плагина и в relay_table.
groups:
  - name: V
    reason: одна шина вольтметра
  - name: M
    reason: одна шина мультиметра
  - name: A
    reason: одна шина амперметра
  - name: CH1
    reason: первый канал осциллографа
  - name: D1
    reason: точка изделия не подключается на обе шины измерителя изоляции сразу
  - name: D2
    reason: то же
  - name: D3
    reason: то же
  - name: D4
    reason: то же
  - name: D5
    reason: то же
  - name: D6
    reason: то же
  - name: RA
    reason: секция A не подключается одновременно к изделию и к мультиметру
  - name: RB
    reason: то же для секции B

relays:
  # --- V: вольтметр ---
